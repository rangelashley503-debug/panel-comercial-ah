<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black antialiased">
    <!-- Barra de navegación -->
<header class="border-b border-gray-200 bg-white shadow-sm">
    <nav class="mx-auto flex max-w-5xl items-center gap-6 p-4">
        <a href="../index.html" class="shrink-0 text-xl font-bold tracking-tight">Impulso Mexa</a>

        <!-- Menú con scroll horizontal para pantallas chicas -->
        <ul id="menu" class="flex gap-5 overflow-x-auto whitespace-nowrap text-sm font-medium">
            <li><a href="../Administraci%C3%B3n%20y%20supervisi%C3%B3n-H/admi.html">Administración</a></li>
            <li><a href="../Autenticaci%C3%B3n%20y%20usuarios/Inicio%20de%20sesi%C3%B3n.html">Acceso</a></li>
            <li><a href="../Catalogo%20de%20productos-%20H/catalogo.html">Catálogo</a></li>
            <li><a href="../Clientes%20y%20cuentas%20comerciales%20-%20K/Clientes.html">Clientes</a></li>
            <li><a href="../Gesti%C3%B3n%20de%20pedidos%20y%20cotizaciones%20-%20K/Gesti%C3%B3n.html">Pedidos</a></li>
            <li><a href="../Inventario%20y%20existencias-H/inventario.html">Inventario</a></li>
            <li><a href="../Pagos,%20reportes%20y%20panel%20-%20K/Pagos.html">Pagos</a></li>
            <li><a href="../Surtido%20de%20almac%C3%A9n%20y%20log%C3%ADstica%20-%20K/Surtido.html">Surtido</a></li>
            <li><a href="../Ventas%20de%20mostrador-H/ventas_mostrador.html">Mostrador</a></li>
        </ul>
    </nav>
</header>

    <main class="mx-auto max-w-5xl space-y-8 p-4 py-8">

<!-- Tarjeta centrada de inicio de sesión -->
<section class="mx-auto w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <div class="text-center">
    <!-- Logo de la empresa -->
    <img
        src="Imagenes/logo-impulso-mexa.png"
        alt="Logo de Impulso Mexa"
        class="mx-auto mb-4 h-24 w-24 object-contain"
    >

    <h1 class="text-2xl font-bold">Iniciar Sesión</h1>

    <p class="mt-1 text-sm text-gray-500">
        Accede con tu cuenta y selecciona tu rol.
    </p>
</div>

    <form id="form-login" class="mt-6 space-y-4">
        <!-- Selector de rol -->
        <div>
            <label for="rol" class="block text-sm font-medium">Rol</label>
            <select id="rol"
                class="mt-1 w-full rounded-lg border border-gray-200 bg-white p-2.5 text-sm focus:border-orange-500 focus:outline-none">
                <option>Vendedor</option>
                <option>Almacén</option>
                <option>Administrador</option>
                <option>Cliente</option>
            </select>
        </div>

        <!-- Correo -->
        <div>
            <label for="login-correo" class="block text-sm font-medium">Correo electrónico</label>
            <input id="login-correo" type="email" placeholder="correo@ejemplo.com"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Contraseña con botón para mostrarla -->
        <div>
            <label for="login-password" class="block text-sm font-medium">Contraseña</label>
            <div class="relative mt-1">
                <input id="login-password" type="password" placeholder="Tu contraseña"
                    class="w-full rounded-lg border border-gray-200 p-2.5 pr-20 text-sm focus:border-orange-500 focus:outline-none">
                <button type="button" id="btn-mostrar"
                    class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-orange-600 hover:text-orange-700">
                    Mostrar
                </button>
            </div>
        </div>

        <!-- Recordarme y enlace de recuperación -->
        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-gray-500">
                <input type="checkbox" class="h-4 w-4 accent-orange-600">
                Recordarme
            </label>
            <a href="#" class="font-medium text-orange-600 hover:text-orange-700">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Mensaje de resultado del login -->
        <p id="mensaje-login" class="hidden rounded-lg border border-gray-200 bg-gray-50 p-3 text-sm"></p>

        <!-- Botón de acceso -->
        <button type="submit"
            class="w-full rounded-lg bg-orange-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-orange-700">
            Entrar
        </button>
    </form>
</section>

<script>
    // Referencias a los elementos del formulario
    const formLogin = document.getElementById('form-login');
    const inputPasswordLogin = document.getElementById('login-password');
    const botonMostrar = document.getElementById('btn-mostrar');
    const mensajeLogin = document.getElementById('mensaje-login');

    // Validación básica del formato del correo
    const formatoCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function mostrarMensaje(elemento, texto) {
        elemento.textContent = texto;
        elemento.classList.remove('hidden');
    }

    // Mostrar u ocultar contraseña: independiente del envío del formulario
    botonMostrar.addEventListener('click', function () {
        const estaOculta = inputPasswordLogin.type === 'password';

        inputPasswordLogin.type = estaOculta ? 'text' : 'password';
        botonMostrar.textContent = estaOculta ? 'Ocultar' : 'Mostrar';
    });

    // Validar y simular el inicio de sesión
    formLogin.addEventListener('submit', function (evento) {
        evento.preventDefault();

        const rol = document.getElementById('rol').value;
        const correo = document.getElementById('login-correo').value.trim();
        const password = inputPasswordLogin.value;

        if (!formatoCorreo.test(correo)) {
            mostrarMensaje(
                mensajeLogin,
                'Escribe un correo electrónico válido.'
            );
            return;
        }

        if (password === '') {
            mostrarMensaje(
                mensajeLogin,
                'Escribe tu contraseña.'
            );
            return;
        }

        // Solo es una simulación; aquí iría la petición al servidor.
        mostrarMensaje(
            mensajeLogin,
            'Sesión iniciada como ' + rol + ' (' + correo + ').'
        );

        formLogin.reset();

        // Restaurar también la visibilidad y el texto del botón
        inputPasswordLogin.type = 'password';
        botonMostrar.textContent = 'Mostrar';
    });
</script>
