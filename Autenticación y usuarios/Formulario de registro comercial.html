<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Comercial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../barra-lateral.js">
        (function () {
            'use strict';
 
        // Carpeta donde está este archivo (la raíz del proyecto): de aquí salen todas las rutas
        var RAIZ = new URL('./', document.currentScript.src);
 
        var CLAVE_USUARIO = 'impulsomexa.usuario';
        var CLAVE_COLAPSO = 'impulsomexa.barraColapsada';
 
        // Íconos (SVG sencillos, sin librerías externas)
        var ICONOS = {
            administracion: '<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>',
            catalogo: '<path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>',
            clientes: '<path d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 014-4h2a4 4 0 014 4v2H9zm1-8a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm6.5-6.8a3 3 0 010 5.6"/>',
            pedidos: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>',
            inventario: '<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>',
            pagos: '<path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>',
            surtido: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
            mostrador: '<path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',
            colapsar: '<path d="M15 19l-7-7 7-7"/>',
            menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
            cerrar: '<path d="M6 18L18 6M6 6l12 12"/>',
            salir: '<path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>'
        };
 
        // Módulos del sistema y qué roles pueden entrar a cada uno
        var TODOS = ['Administrador', 'Vendedor', 'Almacén', 'Cliente'];
        var MODULOS = [
            { nombre: 'Administración', icono: 'administracion', carpeta: 'Administración y supervisión-H', archivo: 'admi.html', roles: ['Administrador'] },
            { nombre: 'Catálogo', icono: 'catalogo', carpeta: 'Catalogo de productos- H', archivo: 'catalogo.html', roles: TODOS },
            { nombre: 'Clientes', icono: 'clientes', carpeta: 'Clientes y cuentas comerciales - K', archivo: 'Clientes.html', roles: ['Administrador', 'Vendedor'] },
            { nombre: 'Pedidos', icono: 'pedidos', carpeta: 'Gestión de pedidos y cotizaciones - K', archivo: 'Gestión.html', roles: TODOS },
            { nombre: 'Inventario', icono: 'inventario', carpeta: 'Inventario y existencias-H', archivo: 'inventario.html', roles: ['Administrador', 'Vendedor', 'Almacén'] },
            { nombre: 'Pagos', icono: 'pagos', carpeta: 'Pagos, reportes y panel - K', archivo: 'Pagos.html', roles: ['Administrador', 'Vendedor'] },
            { nombre: 'Surtido', icono: 'surtido', carpeta: 'Surtido de almacén y logística - K', archivo: 'Surtido.html', roles: ['Administrador', 'Almacén'] },
            { nombre: 'Mostrador', icono: 'mostrador', carpeta: 'Ventas de mostrador-H', archivo: 'ventas_mostrador.html', roles: ['Administrador', 'Vendedor'] }
        ];
 
        // Clases de Tailwind de cada tipo de enlace del menú
        var CLASE_ITEM = 'flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold transition-colors ';
        var CLASE_ACTIVO = 'bg-[#dc3b17] text-white';
        var CLASE_INACTIVO = 'text-slate-300 hover:bg-white/10 hover:text-white';
 
        // ---------- Funciones auxiliares ----------
 
        function icono(nombre, clases) {
            return '<svg class="' + clases + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                ICONOS[nombre] + '</svg>';
        }
 
        // Dirección (con espacios y acentos codificados) de la página principal de un módulo
        function rutaModulo(modulo) {
            return new URL(encodeURIComponent(modulo.carpeta) + '/' + encodeURIComponent(modulo.archivo), RAIZ).href;
        }
 
        function irAlLogin() {
            window.location.href = new URL(
                encodeURIComponent('Autenticación y usuarios') + '/' + encodeURIComponent('Inicio de sesión.html'),
            RAIZ
            ).href;
        }
 
        // Iniciales para el círculo del usuario (ej. "María Hernández" -> "MH")
        function iniciales(texto) {
            var partes = (texto || '').split(/[\s@._-]+/).filter(Boolean).slice(0, 2);
            return partes.map(function (parte) { return parte.charAt(0); }).join('').toUpperCase() || '?';
        }
 
        // Lee y guarda datos del navegador sin romper la página si el almacenamiento no está disponible
        function leer(almacen, clave) {
            try { return almacen.getItem(clave); } catch (error) { return null; }
        }
 
        function guardar(almacen, clave, valor) {
            try {
                if (valor === null) { almacen.removeItem(clave); } else { almacen.setItem(clave, valor); }
            } catch (error) { /* si no se puede guardar, no pasa nada */ }
        }
 
        // ---------- Estructura de la barra ----------
 
        var escritorio = window.matchMedia('(min-width: 1024px)');
        var preferenciaColapso = leer(window.localStorage, CLAVE_COLAPSO) === '1';
 
        // Se quita el menú superior anterior, si la página todavía lo tiene
        var encabezadoViejo = document.querySelector('body > header');
        if (encabezadoViejo) {
            encabezadoViejo.remove();
        }
 
        var fondo = document.createElement('div');
        fondo.className = 'fixed inset-0 z-30 hidden bg-black/40 lg:hidden';
 
        var barra = document.createElement('aside');
        barra.id = 'barra-lateral';
        barra.setAttribute('aria-label', 'Barra de navegación');
        barra.className = 'fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col bg-[#1d3a64] text-white ' +
            'transition-transform duration-200 lg:sticky lg:top-0 lg:h-screen lg:translate-x-0 lg:shrink-0';
        barra.innerHTML =
            '<div data-parte="cabecera" class="flex items-center gap-3 border-b border-white/10 px-4 py-4">' +
            '<div data-parte="inicial" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#dc3b17] text-lg font-bold">I</div>' +
            '<span data-parte="rol" class="etiqueta min-w-0 flex-1 truncate text-lg font-bold">Impulso Mexa</span>' +
            '<button type="button" data-parte="colapsar" class="hidden shrink-0 rounded-lg p-1 text-slate-400 hover:text-white lg:block">' +
                icono('colapsar', 'h-5 w-5 transition-transform') +
            '</button>' +
            '<button type="button" data-parte="cerrar-movil" aria-label="Cerrar menú" class="shrink-0 rounded-lg p-1 text-slate-400 hover:text-white lg:hidden">' +
                icono('cerrar', 'h-5 w-5') +
            '</button>' +
            '</div>' +
            '<nav data-parte="menu" aria-label="Módulos" class="flex-1 space-y-1 overflow-y-auto px-3 py-4"></nav>' +
            '<div class="border-t border-white/10 p-4">' +
            '<div data-parte="pie" class="flex items-center gap-3">' +
                '<div data-parte="avatar" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/15 text-sm font-bold text-orange-400">··</div>' +
                '<div class="etiqueta min-w-0 flex-1">' +
                    '<p data-parte="nombre" class="truncate text-sm font-semibold">Cargando...</p>' +
                    '<p data-parte="tienda" class="truncate text-xs text-slate-400"></p>' +
                '</div>' +
                '<button type="button" data-parte="salir" title="Cerrar sesión" aria-label="Cerrar sesión" class="shrink-0 rounded-lg p-1 text-slate-400 hover:text-white">' +
                    icono('salir', 'h-5 w-5') +
                '</button>' +
            '</div>' +
            '</div>';
 
        function parte(nombre) {
            return barra.querySelector('[data-parte="' + nombre + '"]');
        }
 
        var cabecera = parte('cabecera');
        var inicialRol = parte('inicial');
        var textoRol = parte('rol');
        var botonColapsar = parte('colapsar');
        var botonCerrarMovil = parte('cerrar-movil');
        var menu = parte('menu');
        var pie = parte('pie');
        var avatar = parte('avatar');
        var textoNombre = parte('nombre');
        var textoTienda = parte('tienda');
        var botonSalir = parte('salir');
    
        // Barra superior que solo aparece en celular, con el botón para abrir el menú
        var barraMovil = document.createElement('div');
        barraMovil.className = 'sticky top-0 z-20 flex items-center gap-3 border-b border-gray-200 bg-white px-4 py-3 lg:hidden';
        barraMovil.innerHTML =
            '<button type="button" aria-label="Abrir menú" aria-controls="barra-lateral" aria-expanded="false" ' +
                'class="rounded-lg border border-gray-200 p-2 text-gray-700 hover:bg-gray-50">' +
                icono('menu', 'h-5 w-5') +
            '</button>' +
            '<span class="truncate text-lg font-bold">Impulso Mexa</span>';
        var botonAbrirMovil = barraMovil.querySelector('button');
        var tituloMovil = barraMovil.querySelector('span');
    
        // El resto de la página pasa a una columna a la derecha de la barra
        var columna = document.createElement('div');
        columna.className = 'flex min-w-0 flex-1 flex-col';
    
        var contenido = Array.prototype.slice.call(document.body.children).filter(function (elemento) {
            return elemento.tagName !== 'SCRIPT';
        });
        document.body.classList.add('flex', 'min-h-screen');
        document.body.appendChild(columna);
        columna.appendChild(barraMovil);
        contenido.forEach(function (elemento) { columna.appendChild(elemento); });
        document.body.insertBefore(barra, document.body.firstChild);
        document.body.insertBefore(fondo, document.body.firstChild);
    
        // ---------- Comportamiento ----------
    
        // Aplica el estado (expandida o contraída) a todos los elementos de la barra
        function aplicarEstado() {
            // En celular el menú siempre se muestra completo
            var colapsada = preferenciaColapso && escritorio.matches;
    
            barra.classList.toggle('w-64', !colapsada);
            barra.classList.toggle('w-[76px]', colapsada);
    
            barra.querySelectorAll('.etiqueta').forEach(function (elemento) {
                elemento.classList.toggle('hidden', colapsada);
            });
            cabecera.classList.toggle('flex-col', colapsada);
            pie.classList.toggle('flex-col', colapsada);
            menu.querySelectorAll('a').forEach(function (enlace) {
                enlace.classList.toggle('justify-center', colapsada);
            });
    
            botonColapsar.querySelector('svg').classList.toggle('rotate-180', colapsada);
            botonColapsar.setAttribute('aria-expanded', String(!colapsada));
            botonColapsar.setAttribute('aria-label', colapsada ? 'Expandir barra lateral' : 'Contraer barra lateral');
        }
    
        // Dibuja los módulos que le corresponden al rol
        function pintarMenu(rol) {
            var ruta = decodeURIComponent(window.location.pathname);
            menu.replaceChildren();
    
            MODULOS.forEach(function (modulo) {
                if (modulo.roles.indexOf(rol) === -1) {
                    return;
                }
    
                var activo = ruta.indexOf('/' + modulo.carpeta + '/') !== -1;
                var enlace = document.createElement('a');
    
                enlace.href = rutaModulo(modulo);
                enlace.title = modulo.nombre;
                enlace.className = CLASE_ITEM + (activo ? CLASE_ACTIVO : CLASE_INACTIVO);
                enlace.innerHTML = icono(modulo.icono, 'h-6 w-6 shrink-0');
    
                var texto = document.createElement('span');
                texto.className = 'etiqueta truncate';
                texto.textContent = modulo.nombre;
                enlace.appendChild(texto);
    
                if (activo) {
                    enlace.setAttribute('aria-current', 'page');
                    tituloMovil.textContent = modulo.nombre;
                }
                menu.appendChild(enlace);
            });
    
            aplicarEstado();
        }
    
        // Muestra los datos del usuario (textContent: nunca se interpreta como HTML)
        function pintarUsuario(usuario) {
            var nombre = usuario.nombre || usuario.correo;
    
            textoRol.textContent = usuario.rol;
            inicialRol.textContent = usuario.rol.charAt(0).toUpperCase();
    
            textoNombre.textContent = nombre;
            avatar.textContent = iniciales(nombre);
    
            // Segunda línea: la tienda (clientes) o el correo (personal)
            textoTienda.textContent = usuario.tienda || (usuario.nombre ? usuario.correo : 'Impulso Mexa');
            barra.title = '';
            pintarMenu(usuario.rol);
        }
    
        function abrirMenuMovil() {
            barra.classList.remove('-translate-x-full');
            barra.classList.add('translate-x-0');
            fondo.classList.remove('hidden');
            botonAbrirMovil.setAttribute('aria-expanded', 'true');
        }
    
        function cerrarMenuMovil() {
            barra.classList.add('-translate-x-full');
            barra.classList.remove('translate-x-0');
            fondo.classList.add('hidden');
            botonAbrirMovil.setAttribute('aria-expanded', 'false');
        }
    
        // Contraer / expandir (solo en pantallas grandes)
        botonColapsar.addEventListener('click', function () {
            preferenciaColapso = !preferenciaColapso;
            guardar(window.localStorage, CLAVE_COLAPSO, preferenciaColapso ? '1' : '0');
            aplicarEstado();
        });
    
        botonAbrirMovil.addEventListener('click', abrirMenuMovil);
        botonCerrarMovil.addEventListener('click', cerrarMenuMovil);
        fondo.addEventListener('click', cerrarMenuMovil);
        document.addEventListener('keydown', function (evento) {
            if (evento.key === 'Escape') {
                cerrarMenuMovil();
            }
        });
    
        // Si se cambia el tamaño de la ventana, se recalcula el estado
        escritorio.addEventListener('change', function () {
            cerrarMenuMovil();
            aplicarEstado();
        });
    
        // Cerrar sesión: el servidor borra la sesión y se regresa al login
        botonSalir.addEventListener('click', function () {
            botonSalir.disabled = true;
            fetch('/api/logout', { method: 'POST' })
                .catch(function () { /* aunque falle la red, se sale de la página */ })
                .then(function () {
                    guardar(window.sessionStorage, CLAVE_USUARIO, null);
                    irAlLogin();
                });
        });
    
        // ---------- Arranque ----------
    
        // Si ya se conocía al usuario (de la página anterior), se muestra al instante
        var guardado = leer(window.sessionStorage, CLAVE_USUARIO);
        if (guardado) {
            try { pintarUsuario(JSON.parse(guardado)); } catch (error) { aplicarEstado(); }
        } else {
            aplicarEstado();
        }
    
        // Se confirma con el servidor quién es el usuario (también actualiza el nombre y la tienda)
        fetch('/api/sesion')
            .then(function (respuesta) {
                if (respuesta.status === 401) {
                    guardar(window.sessionStorage, CLAVE_USUARIO, null);
                    irAlLogin();
                    return null;
                }
                return respuesta.json();
            })
            .then(function (usuario) {
                if (usuario && usuario.rol) {
                    guardar(window.sessionStorage, CLAVE_USUARIO, JSON.stringify(usuario));
                    pintarUsuario(usuario);
                }
            })
            .catch(function () {
                // Sin conexión con el servidor: se deja lo que ya había en pantalla
                if (!guardado) {
                    textoNombre.textContent = 'Sin conexión';
                }
            });
        })();
    
    </script>

    <style>
        .campo-error {
            border-color: #dc2626 !important;
        }

        .campo-error:focus {
            outline: 2px solid #fecaca;
            outline-offset: 1px;
        }
    </style>
</head>

<body class="bg-white text-black antialiased">
    <header class="border-b border-gray-200 bg-white shadow-sm">
        <nav class="flex w-full items-center gap-6 px-6 py-4 lg:px-10">
            <a href="../index.html" class="text-xl font-bold tracking-tight">Impulso Mexa</a>
        </nav>
    </header>

    <main class="w-full space-y-8 px-6 py-8 lg:px-10">
        <section
            class="mx-auto w-full max-w-2xl rounded-xl border
                   border-gray-200 bg-white p-6 shadow-sm"
        >
            <h2 class="text-xl font-bold">Registro Comercial</h2>

            <p class="mt-1 text-sm text-gray-500">
                Da de alta tu negocio con sus datos fiscales
                para solicitar una cuenta de mayoreo.
            </p>

            <p class="mt-2 text-sm text-gray-600">
                Todos los campos son obligatorios.
            </p>

            <!-- Los mensajes se controlan con JavaScript. -->
            <form
                id="form-registro"
                class="mt-4 grid gap-4 sm:grid-cols-2"
                novalidate
            >
                <div class="sm:col-span-2">
                    <label for="razon" class="block text-sm font-medium">
                        Razón social
                    </label>

                    <input
                        id="razon"
                        name="razon"
                        type="text"
                        required
                        autocomplete="organization"
                        aria-describedby="error-razon"
                        placeholder="Nombre legal del negocio"
                        class="mt-1 w-full rounded-lg border border-gray-200
                               p-2.5 text-sm focus:border-orange-500
                               focus:outline-none"
                    >

                    <p
                        id="error-razon"
                        class="mt-1 text-sm text-red-600"
                    ></p>
                </div>

                <div>
                    <label for="reg-rfc" class="block text-sm font-medium">
                        RFC
                    </label>

                    <input
                        id="reg-rfc"
                        name="rfc"
                        type="text"
                        required
                        minlength="12"
                        maxlength="13"
                        autocapitalize="characters"
                        spellcheck="false"
                        aria-describedby="error-reg-rfc"
                        placeholder="12 o 13 caracteres"
                        class="mt-1 w-full rounded-lg border border-gray-200
                               p-2.5 text-sm uppercase focus:border-orange-500
                               focus:outline-none"
                    >

                    <p
                        id="error-reg-rfc"
                        class="mt-1 text-sm text-red-600"
                    ></p>
                </div>

                <div>
                    <label
                        for="reg-telefono"
                        class="block text-sm font-medium"
                    >
                        Teléfono
                    </label>

                    <input
                        id="reg-telefono"
                        name="telefono"
                        type="tel"
                        required
                        inputmode="numeric"
                        maxlength="10"
                        autocomplete="tel-national"
                        aria-describedby="error-reg-telefono"
                        placeholder="10 dígitos"
                        class="mt-1 w-full rounded-lg border border-gray-200
                               p-2.5 text-sm focus:border-orange-500
                               focus:outline-none"
                    >

                    <p
                        id="error-reg-telefono"
                        class="mt-1 text-sm text-red-600"
                    ></p>
                </div>

                <div class="sm:col-span-2">
                    <label
                        for="reg-correo"
                        class="block text-sm font-medium"
                    >
                        Correo electrónico
                    </label>

                    <input
                        id="reg-correo"
                        name="correo"
                        type="email"
                        required
                        autocomplete="email"
                        aria-describedby="error-reg-correo"
                        placeholder="correo@ejemplo.com"
                        class="mt-1 w-full rounded-lg border border-gray-200
                               p-2.5 text-sm focus:border-orange-500
                               focus:outline-none"
                    >

                    <p
                        id="error-reg-correo"
                        class="mt-1 text-sm text-red-600"
                    ></p>
                </div>

                <div>
                    <label
                        for="reg-password"
                        class="block text-sm font-medium"
                    >
                        Contraseña
                    </label>

                    <div class="relative mt-1">
                        <input
                            id="reg-password"
                            name="password"
                            type="password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            aria-describedby="ayuda-password error-reg-password"
                            placeholder="Mínimo 8 caracteres"
                            class="w-full rounded-lg border border-gray-200
                                   p-2.5 pr-20 text-sm focus:border-orange-500
                                   focus:outline-none"
                        >

                        <button
                            type="button"
                            data-password="reg-password"
                            aria-controls="reg-password"
                            aria-pressed="false"
                            aria-label="Mostrar contraseña"
                            class="absolute inset-y-0 right-0 px-3
                                   text-sm font-medium text-orange-700"
                        >
                            Mostrar
                        </button>
                    </div>

                    <p id="ayuda-password" class="mt-1 text-xs text-gray-500">
                        Usa al menos 8 caracteres e incluye un número.
                    </p>

                    <p
                        id="error-reg-password"
                        class="mt-1 text-sm text-red-600"
                    ></p>
                </div>

                <div>
                    <label
                        for="reg-confirmar"
                        class="block text-sm font-medium"
                    >
                        Confirmar contraseña
                    </label>

                    <div class="relative mt-1">
                        <input
                            id="reg-confirmar"
                            type="password"
                            required
                            autocomplete="new-password"
                            aria-describedby="error-reg-confirmar"
                            placeholder="Repite la contraseña"
                            class="w-full rounded-lg border border-gray-200
                                   p-2.5 pr-20 text-sm focus:border-orange-500
                                   focus:outline-none"
                        >

                        <button
                            type="button"
                            data-password="reg-confirmar"
                            aria-controls="reg-confirmar"
                            aria-pressed="false"
                            aria-label="Mostrar confirmación de contraseña"
                            class="absolute inset-y-0 right-0 px-3
                                   text-sm font-medium text-orange-700"
                        >
                            Mostrar
                        </button>
                    </div>

                    <p
                        id="error-reg-confirmar"
                        class="mt-1 text-sm text-red-600"
                    ></p>
                </div>

                <div class="sm:col-span-2">
                    <label
                        for="reg-terminos"
                        class="flex items-center gap-2 text-sm text-gray-600"
                    >
                        <input
                            id="reg-terminos"
                            name="terminos"
                            type="checkbox"
                            required
                            aria-describedby="error-reg-terminos"
                            class="h-4 w-4 accent-orange-600"
                        >
                        Acepto los términos y condiciones de venta mayorista
                    </label>

                    <p
                        id="error-reg-terminos"
                        class="mt-1 text-sm text-red-600"
                    ></p>
                </div>

                <p
                    id="mensaje-registro"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                    class="hidden rounded-lg border p-3 text-sm sm:col-span-2"
                ></p>

                <div class="text-right sm:col-span-2">
                    <button
                        type="submit"
                        class="w-full rounded-lg bg-orange-600 px-6 py-2.5
                               text-sm font-medium text-white
                               hover:bg-orange-700 disabled:cursor-not-allowed
                               disabled:opacity-50 sm:w-auto"
                    >
                        Registrar Negocio
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Script del formulario de registro (conectado a la API) -->
    <script>
        const formRegistro = document.getElementById('form-registro');
        const mensajeRegistro = document.getElementById('mensaje-registro');
        const botonEnviar = formRegistro.querySelector('button[type="submit"]');

        const campos = {
            razon: document.getElementById('razon'),
            rfc: document.getElementById('reg-rfc'),
            telefono: document.getElementById('reg-telefono'),
            correo: document.getElementById('reg-correo'),
            password: document.getElementById('reg-password'),
            confirmar: document.getElementById('reg-confirmar'),
            terminos: document.getElementById('reg-terminos')
        };

        const formatoRfc = /^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/;
        const formatoCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        let intentoEnviar = false;

        function mostrarMensaje(texto, esError = true) {
            mensajeRegistro.textContent = texto;

            mensajeRegistro.className =
                'rounded-lg border p-3 text-sm sm:col-span-2 ' +
                (esError
                    ? 'border-red-300 bg-red-50 text-red-700'
                    : 'border-blue-300 bg-blue-50 text-blue-800');
        }

        function ocultarMensaje() {
            mensajeRegistro.textContent = '';
            mensajeRegistro.classList.add('hidden');
        }

        function establecerError(campo, mensaje) {
            const aviso = document.getElementById('error-' + campo.id);

            aviso.textContent = mensaje;
            campo.classList.toggle('campo-error', mensaje !== '');
            campo.setAttribute('aria-invalid', String(mensaje !== ''));

            return mensaje === '';
        }

        function validarCampo(nombre) {
            const campo = campos[nombre];
            let error = '';

            switch (nombre) {
                case 'razon':
                    if (!campo.value.trim()) {
                        error = 'Escribe la razón social del negocio.';
                    }
                    break;

                case 'rfc': {
                    const rfc = campo.value.trim().toUpperCase();

                    if (!rfc) {
                        error = 'Escribe el RFC.';
                    } else if (rfc.length !== 12 && rfc.length !== 13) {
                        error = 'El RFC debe tener 12 o 13 caracteres.';
                    } else if (!formatoRfc.test(rfc)) {
                        error =
                            'Formato incorrecto: usa 3 o 4 letras, ' +
                            '6 dígitos y 3 caracteres de homoclave.';
                    }
                    break;
                }

                case 'telefono':
                    if (!campo.value.trim()) {
                        error = 'Escribe el teléfono.';
                    } else if (!/^\d{10}$/.test(campo.value.trim())) {
                        error = 'El teléfono debe contener exactamente 10 dígitos.';
                    }
                    break;

                case 'correo': {
                    const correo = campo.value.trim();

                    if (!correo) {
                        error = 'Escribe el correo electrónico.';
                    } else if (
                        campo.validity.typeMismatch ||
                        !formatoCorreo.test(correo)
                    ) {
                        error = 'Escribe un correo válido, por ejemplo: correo@ejemplo.com.';
                    }
                    break;
                }

                case 'password':
                    if (!campo.value) {
                        error = 'Escribe una contraseña.';
                    } else if (campo.value.length < 8) {
                        error = 'La contraseña debe tener al menos 8 caracteres.';
                    } else if (!/\d/.test(campo.value)) {
                        error = 'La contraseña debe incluir al menos un número.';
                    }
                    break;

                case 'confirmar':
                    if (!campo.value) {
                        error = 'Repite la contraseña.';
                    } else if (campo.value !== campos.password.value) {
                        error = 'Las contraseñas no coinciden.';
                    }
                    break;

                case 'terminos':
                    if (!campo.checked) {
                        error = 'Debes aceptar los términos y condiciones.';
                    }
                    break;
            }

            return establecerError(campo, error);
        }

        // Validar al salir del campo y al corregir un campo ya revisado.
        Object.entries(campos).forEach(([nombre, campo]) => {
            const evento = campo.type === 'checkbox' ? 'change' : 'input';

            campo.addEventListener(evento, () => {
                ocultarMensaje();

                if (intentoEnviar || campo.dataset.revisado === 'true') {
                    validarCampo(nombre);
                }

                if (
                    nombre === 'password' &&
                    (
                        intentoEnviar ||
                        campos.confirmar.dataset.revisado === 'true'
                    )
                ) {
                    validarCampo('confirmar');
                }
            });

            campo.addEventListener('blur', () => {
                campo.dataset.revisado = 'true';
                validarCampo(nombre);
            });
        });

        // Convertir el RFC a mayúsculas al terminar de editarlo.
        campos.rfc.addEventListener('blur', () => {
            campos.rfc.value = campos.rfc.value.trim().toUpperCase();
        });

        // Mostrar u ocultar cada contraseña de forma independiente.
        document.querySelectorAll('[data-password]').forEach((boton) => {
            const etiquetaOriginal = boton.getAttribute('aria-label');

            // Se guarda para poder restaurar el botón al limpiar el formulario
            boton.dataset.etiquetaOriginal = etiquetaOriginal;

            boton.addEventListener('click', () => {
                const campo = document.getElementById(
                    boton.dataset.password
                );

                const mostrar = campo.type === 'password';

                campo.type = mostrar ? 'text' : 'password';
                boton.textContent = mostrar ? 'Ocultar' : 'Mostrar';
                boton.setAttribute('aria-pressed', String(mostrar));
                boton.setAttribute(
                    'aria-label',
                    mostrar
                        ? etiquetaOriginal.replace('Mostrar', 'Ocultar')
                        : etiquetaOriginal
                );
            });
        });

        // Deja el formulario como nuevo después de un registro exitoso.
        function limpiarFormulario() {
            formRegistro.reset();
            intentoEnviar = false;

            Object.values(campos).forEach((campo) => {
                establecerError(campo, '');
                campo.removeAttribute('aria-invalid');
                delete campo.dataset.revisado;
            });

            document.querySelectorAll('[data-password]').forEach((boton) => {
                document.getElementById(boton.dataset.password).type = 'password';
                boton.textContent = 'Mostrar';
                boton.setAttribute('aria-pressed', 'false');
                boton.setAttribute('aria-label', boton.dataset.etiquetaOriginal);
            });
        }

        formRegistro.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            intentoEnviar = true;

            let primerCampoInvalido = null;

            // Revisar todos los campos, no solo el primero incorrecto.
            Object.keys(campos).forEach((nombre) => {
                const esValido = validarCampo(nombre);

                if (!esValido && primerCampoInvalido === null) {
                    primerCampoInvalido = campos[nombre];
                }
            });

            if (primerCampoInvalido) {
                mostrarMensaje(
                    'No se puede registrar el negocio. ' +
                    'Completa los campos obligatorios y corrige ' +
                    'los errores indicados.'
                );

                primerCampoInvalido.focus();
                return;
            }

            // Datos que se envían al servidor (la contraseña no se modifica)
            const datos = {
                razon: campos.razon.value.trim(),
                rfc: campos.rfc.value.trim().toUpperCase(),
                telefono: campos.telefono.value.trim(),
                correo: campos.correo.value.trim(),
                password: campos.password.value
            };

            // Se bloquea el botón mientras se envía para evitar registros duplicados
            botonEnviar.disabled = true;
            botonEnviar.textContent = 'Enviando...';

            try {
                const respuesta = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                // Si el servidor no devuelve JSON, se usa un objeto vacío
                const resultado = await respuesta.json().catch(() => ({}));

                if (!respuesta.ok) {
                    mostrarMensaje(resultado.error || 'No se pudo registrar el negocio.');
                    return;
                }

                mostrarMensaje(
                    resultado.mensaje || 'Solicitud enviada correctamente.',
                    false
                );
                limpiarFormulario();
            } catch (error) {
                mostrarMensaje('No se pudo conectar con el servidor.');
            } finally {
                botonEnviar.disabled = false;
                botonEnviar.textContent = 'Registrar Negocio';
            }
        });
    </script>
</body>
</html>
