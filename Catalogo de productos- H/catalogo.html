<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tu archivo de colores centralizado -->
    <script src="../Paletadecolores.js"></script>

    <style>
        /* Transición del sidebar y contenido */
        #sidebar,
        #main-wrapper {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar colapsado */
        #sidebar.is-collapsed {
            width: 5rem;
        }

        #sidebar.is-collapsed .sidebar-label,
        #sidebar.is-collapsed .brand-name {
            display: none;
        }

        #sidebar.is-collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        @media (min-width: 1024px) {
            #main-wrapper {
                margin-left: 16rem;
            }

            #sidebar.is-collapsed ~ #main-wrapper {
                margin-left: 5rem;
            }
        }

        /* Efecto del catálogo */
        .catalogo-card img {
            transition: transform 0.35s ease;
        }

        .catalogo-card:hover img {
            transform: scale(1.08);
        }

        .catalogo-overlay {
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .catalogo-card:hover .catalogo-overlay {
            opacity: 1;
        }
    </style>
</head>

<body class="bg-surface-app text-content-body antialiased min-h-screen flex flex-col lg:flex-row">

    <!-- SIDEBAR -->
    <aside
        id="sidebar"
        class="fixed top-0 left-0 z-50 h-screen w-64 bg-brand-navy text-white flex flex-col justify-between shadow-xl"
        aria-label="Navegación principal"
    >
        <div>
            <!-- Header del Sidebar -->
            <div class="flex items-center justify-between p-5 border-b border-white/10 h-20">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="h-10 w-10 shrink-0 rounded-xl bg-brand-terracotta flex items-center justify-center font-bold text-lg shadow-md">
                        C
                    </div>

                    <span class="brand-name font-bold text-lg tracking-wide whitespace-nowrap">
                        Cliente
                    </span>
                </div>

                <button
                    type="button"
                    id="toggleSidebar"
                    class="p-2 rounded-lg text-content-muted hover:text-white hover:bg-white/10 transition-colors"
                    aria-label="Colapsar menú"
                >
                    <svg
                        class="w-5 h-5 toggle-icon transition-transform duration-300"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
            </div>

            <!-- Navegación -->
            <nav class="p-4 space-y-1.5">
                <button
                    type="button"
                    class="sidebar-nav-btn active w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 bg-brand-terracotta text-white shadow-md shadow-brand-terracotta/20"
                    aria-label="Catálogo"
                    aria-current="page"
                    data-section="catalogo"
                >
                    <span class="shrink-0">
                        <svg
                            class="w-6 h-6"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M16 11V7a4 4 0 0 0-8 0v4" />
                            <path d="M5 9h14l1 12H4L5 9Z" />
                        </svg>
                    </span>

                    <span class="sidebar-label whitespace-nowrap">Catálogo</span>
                </button>

                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Pedidos"
                    data-section="pedidos"
                >
                    <span class="shrink-0">
                        <svg
                            class="w-6 h-6"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
                            <rect x="9" y="3" width="6" height="4" rx="2" />
                            <path d="M9 14h6M9 18h6" />
                        </svg>
                    </span>

                    <span class="sidebar-label whitespace-nowrap">Pedidos</span>
                </button>
            </nav>
        </div>

        <!-- Usuario -->
        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="h-9 w-9 shrink-0 rounded-full bg-brand-cream/20 text-brand-amber flex items-center justify-center font-bold text-xs uppercase border border-white/10">
                    AD
                </div>

                <div class="sidebar-label leading-tight overflow-hidden text-ellipsis whitespace-nowrap">
                    <p class="text-xs font-semibold text-white">Nombre cliente</p>
                    <p class="text-[11px] text-content-muted">Nombre tienda</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-wrapper" class="flex-1 w-full min-h-screen">
        <main class="mx-auto max-w-6xl space-y-8 p-6 lg:p-10">

            <header class="space-y-2">
                <h1 class="text-3xl font-bold text-content-heading">
                    Catálogo de Productos
                </h1>

                <p class="text-sm text-content-muted">
                    Pasa el cursor sobre una imagen para ver el nombre del producto.
                </p>
            </header>

            <!-- CATÁLOGO -->
            <section>
                <div
                    id="catalogo"
                    class="grid gap-5 grid-cols-2 sm:grid-cols-3 xl:grid-cols-4"
                ></div>
            </section>

        </main>
    </div>

    <!-- SCRIPTS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleSidebar');
            const navButtons = document.querySelectorAll('.sidebar-nav-btn');

            // Colapsar / expandir sidebar
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('is-collapsed');
            });

            // Botón activo del menú
            navButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    navButtons.forEach((item) => {
                        item.classList.remove(
                            'active',
                            'bg-brand-terracotta',
                            'text-white',
                            'shadow-md',
                            'shadow-brand-terracotta/20'
                        );

                        item.classList.add(
                            'text-content-muted',
                            'hover:bg-white/10',
                            'hover:text-white'
                        );

                        item.removeAttribute('aria-current');
                    });

                    btn.classList.remove(
                        'text-content-muted',
                        'hover:bg-white/10',
                        'hover:text-white'
                    );

                    btn.classList.add(
                        'active',
                        'bg-brand-terracotta',
                        'text-white',
                        'shadow-md',
                        'shadow-brand-terracotta/20'
                    );

                    btn.setAttribute('aria-current', 'page');
                });
            });

            // Catálogo de productos
            const productos = [
                { nombre: "Producto 01", imagen: "imagenes/producto-01.jpg" },
                { nombre: "Producto 02", imagen: "imagenes/producto-02.jpg" },
                { nombre: "Producto 03", imagen: "imagenes/producto-03.jpg" },
                { nombre: "Producto 04", imagen: "imagenes/producto-04.jpg" },
                { nombre: "Producto 05", imagen: "imagenes/producto-05.jpg" },
                { nombre: "Producto 06", imagen: "imagenes/producto-06.jpg" },
                { nombre: "Producto 07", imagen: "imagenes/producto-07.jpg" },
                { nombre: "Producto 08", imagen: "imagenes/producto-08.jpg" },
                { nombre: "Producto 09", imagen: "imagenes/producto-09.jpg" },
                { nombre: "Producto 10", imagen: "imagenes/producto-10.jpg" },
                { nombre: "Producto 11", imagen: "imagenes/producto-11.jpg" },
                { nombre: "Producto 12", imagen: "imagenes/producto-12.jpg" },
                { nombre: "Producto 13", imagen: "imagenes/producto-13.jpg" },
                { nombre: "Producto 14", imagen: "imagenes/producto-14.jpg" },
                { nombre: "Producto 15", imagen: "imagenes/producto-15.jpg" },
                { nombre: "Producto 16", imagen: "imagenes/producto-16.jpg" },
                { nombre: "Producto 17", imagen: "imagenes/producto-17.jpg" },
                { nombre: "Producto 18", imagen: "imagenes/producto-18.jpg" },
                { nombre: "Producto 19", imagen: "imagenes/producto-19.jpg" },
                { nombre: "Producto 20", imagen: "imagenes/producto-20.jpg" },
                { nombre: "Producto 21", imagen: "imagenes/producto-21.jpg" }
            ];

            const catalogo = document.getElementById('catalogo');

            productos.forEach((producto) => {
                const card = document.createElement('article');

                card.className =
                    'catalogo-card relative overflow-hidden rounded-xl border border-border-subtle bg-surface-card shadow-sm';

                card.innerHTML = `
                    <div class="aspect-square overflow-hidden">
                        <img
                            src="${producto.imagen}"
                            alt="${producto.nombre}"
                            loading="lazy"
                            class="h-full w-full object-cover"
                        >
                    </div>

                    <div class="catalogo-overlay absolute inset-0 flex items-end justify-center bg-gradient-to-t from-black/80 via-black/30 to-transparent p-4">
                        <p class="text-center text-base font-semibold text-white drop-shadow">
                            ${producto.nombre}
                        </p>
                    </div>
                `;

                catalogo.appendChild(card);
            });
        });
    </script>
</body>
</html>
