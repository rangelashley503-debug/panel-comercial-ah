<h1 class="text-3xl font-bold text-stone-800">Pagos, Reportes y Panel Administrativo</h1>

<!-- Tarjetas de corte de turno: 1 columna en móvil, 3 en pantalla grande -->
<section class="grid gap-4 sm:grid-cols-3">
    <article class="rounded-xl border border-stone-200 bg-white p-5">
        <p class="text-sm font-medium text-stone-500">Ventas Totales del Turno</p>
        <p class="mt-1 text-3xl font-bold text-green-600">$84,520.00</p>
    </article>
    <article class="rounded-xl border border-stone-200 bg-white p-5">
        <p class="text-sm font-medium text-stone-500">Pedidos Completados</p>
        <p class="mt-1 text-3xl font-bold text-blue-600">23</p>
    </article>
    <article class="rounded-xl border border-stone-200 bg-white p-5">
        <p class="text-sm font-medium text-stone-500">Alertas de Stock Mínimo</p>
        <p class="mt-1 text-3xl font-bold text-amber-600">4</p>
    </article>
</section>

<!-- Desglose del corte de caja -->
<section class="rounded-xl border border-stone-200 bg-white p-6">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <h2 class="text-xl font-bold text-stone-800">Corte de Caja</h2>
        <span class="w-fit rounded-full bg-blue-100 px-3 py-1 text-xs font-medium text-blue-700">Turno matutino</span>
    </div>

    <div class="mt-4 overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="border-b border-stone-200 text-xs uppercase tracking-wider text-stone-500">
                <tr>
                    <th class="py-3 pr-4 font-semibold">Método de pago</th>
                    <th class="py-3 pr-4 font-semibold">Operaciones</th>
                    <th class="py-3 text-right font-semibold">Monto</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-stone-100">
                <tr class="hover:bg-stone-50">
                    <td class="py-3 pr-4 font-medium text-stone-800">Efectivo</td>
                    <td class="py-3 pr-4 text-stone-500">11</td>
                    <td class="py-3 text-right text-stone-800">$32,150.00</td>
                </tr>
                <tr class="hover:bg-stone-50">
                    <td class="py-3 pr-4 font-medium text-stone-800">Tarjeta</td>
                    <td class="py-3 pr-4 text-stone-500">7</td>
                    <td class="py-3 text-right text-stone-800">$21,870.00</td>
                </tr>
                <tr class="hover:bg-stone-50">
                    <td class="py-3 pr-4 font-medium text-stone-800">Transferencia</td>
                    <td class="py-3 pr-4 text-stone-500">5</td>
                    <td class="py-3 text-right text-stone-800">$30,500.00</td>
                </tr>
            </tbody>
            <!-- Fila de total -->
            <tfoot class="border-t border-stone-200">
                <tr>
                    <td class="py-3 pr-4 font-bold text-stone-800">Total</td>
                    <td class="py-3 pr-4 font-medium text-stone-500">23</td>
                    <td class="py-3 text-right font-bold text-stone-800">$84,520.00</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- Botón de acción -->
    <div class="mt-6 border-t border-stone-100 pt-4 text-right">
        <button type="button"
            class="w-full rounded-lg bg-orange-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-orange-700 sm:w-auto">
            Cerrar Turno
        </button>
    </div>
</section>
