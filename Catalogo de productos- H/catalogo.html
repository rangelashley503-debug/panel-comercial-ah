<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos</title>
    <!-- 1. Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Tu archivo de configuración de colores centralizado -->
    <script src="../Paletadecolores.js"></script>

    <style>
        /* Transición fluida para colapsar/expandir el sidebar y el margen del contenido */
        #sidebar, #main-wrapper {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Estado colapsado */
        #sidebar.is-collapsed {
            width: 5rem; /* ~80px */
        }
        #sidebar.is-collapsed .sidebar-label,
        #sidebar.is-collapsed .brand-name {
            display: none;
        }
        #sidebar.is-collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        /* En pantallas de escritorio, el contenido se adapta según el ancho del menú */
        @media (min-width: 1024px) {
            #main-wrapper {
                margin-left: 16rem; /* 256px por defecto */
            }
            #sidebar.is-collapsed ~ #main-wrapper {
                margin-left: 5rem; /* 80px cuando se colapsa */
            }
        }
    </style>
</head>
<body class="bg-surface-app text-content-body antialiased min-h-screen flex flex-col lg:flex-row">

    <!-- SIDEBAR -->
    <aside 
        id="sidebar" 
        class="fixed top-0 left-0 z-50 h-screen w-64 bg-brand-navy text-white flex flex-col justify-between shadow-xl"
        aria-label="Navegación principal"
    >
        <div>
            <!-- Header del Sidebar (Logo + Toggle) -->
            <div class="flex items-center justify-between p-5 border-b border-white/10 h-20">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="h-10 w-10 shrink-0 rounded-xl bg-brand-terracotta flex items-center justify-center font-bold text-lg shadow-md">
                        C
                    </div>
                    <span class="brand-name font-bold text-lg tracking-wide whitespace-nowrap">Cliente</span>
                </div>
                
                <!-- Botón colapsar menú -->
                <button 
                    type="button" 
                    id="toggleSidebar"
                    class="p-2 rounded-lg text-content-muted hover:text-white hover:bg-white/10 transition-colors"
                    aria-label="Colapsar menú"
                >
                    <svg class="w-5 h-5 toggle-icon transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
            </div>

            <!-- Navegación -->
            <nav class="p-4 space-y-1.5">
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Catálogo"
                    data-section="catalogo"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 11V7a4 4 0 0 0-8 0v4" />
                            <path d="M5 9h14l1 12H4L5 9Z" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Catálogo</span>
                </button>

                <button
                    type="button"
                    class="sidebar-nav-btn active w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 bg-brand-terracotta text-white shadow-md shadow-brand-terracotta/20"
                    aria-label="Pedidos"
                    aria-current="page"
                    data-section="pedidos"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
                            <rect x="9" y="3" width="6" height="4" rx="2" />
                            <path d="M9 14h6M9 18h6" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Pedidos</span>
                </button>
            </nav>
        </div>

        <!-- Pie del Sidebar / Usuario -->
        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="h-9 w-9 shrink-0 rounded-full bg-brand-cream/20 text-brand-amber flex items-center justify-center font-bold text-xs uppercase border border-white/10">
                    AD
                </div>
                <div class="sidebar-label leading-tight overflow-hidden text-ellipsis whitespace-nowrap">
                    <p class="text-xs font-semibold text-white">Nombre cliente</p>
                    <p class="text-[11px] text-content-muted">Nombre tienda</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- CONTENEDOR PRINCIPAL DE LA APLICACIÓN -->
    <div id="main-wrapper" class="flex-1 w-full min-h-screen">
        <main class="mx-auto max-w-5xl space-y-8 p-6 lg:p-10">
            <h1 class="text-3xl font-bold text-content-heading">Pedidos de la Semana</h1>

            <!-- Indicadores -->
            <section class="grid gap-4 sm:grid-cols-3">
                <article class="rounded-xl border border-border-subtle bg-surface-card p-5 shadow-sm">
                    <p class="text-sm font-medium text-content-muted">En Producción</p>
                    <p class="mt-1 text-3xl font-bold text-brand-amber">18</p>
                </article>
                <article class="rounded-xl border border-border-subtle bg-surface-card p-5 shadow-sm">
                    <p class="text-sm font-medium text-content-muted">Por Entregar</p>
                    <p class="mt-1 text-3xl font-bold text-brand-cyan">5</p>
                </article>
                <article class="rounded-xl border border-border-subtle bg-surface-card p-5 shadow-sm">
                    <p class="text-sm font-medium text-content-muted">Entregados</p>
                    <p class="mt-1 text-3xl font-bold text-status-success-text">45</p>
                </article>
            </section>

            <!-- Tabla -->
            <section class="overflow-hidden rounded-xl border border-border-subtle bg-surface-card shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-brand-navy text-white text-xs uppercase tracking-wider">
                            <tr>
                                <th class="p-4 font-semibold">Folio</th>
                                <th class="p-4 font-semibold">Cliente</th>
                                <th class="p-4 font-semibold">Etapa</th>
                                <th class="p-4 font-semibold">Entrega</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-border-subtle">
                            <tr class="hover:bg-table-hover transition-colors">
                                <td class="p-4 font-mono font-medium text-brand-navy">#1045</td>
                                <td class="p-4 font-medium">Casa Talavera</td>
                                <td class="p-4">
                                    <span class="rounded-full bg-status-info-bg text-status-info-text border border-brand-cyan/20 px-3 py-1 text-xs font-semibold">
                                        Esmaltado
                                    </span>
                                </td>
                                <td class="p-4 text-content-muted">14 octubre</td>
                            </tr>
                            <tr class="bg-table-zebra hover:bg-table-hover transition-colors">
                                <td class="p-4 font-mono font-medium text-brand-navy">#1046</td>
                                <td class="p-4 font-medium">Hotel Posada</td>
                                <td class="p-4">
                                    <span class="rounded-full bg-brand-cream/40 text-brand-navy border border-brand-cream px-3 py-1 text-xs font-semibold">
                                        Empaque
                                    </span>
                                </td>
                                <td class="p-4 text-content-muted">20 de noviembre</td>
                            </tr>
                            <tr class="hover:bg-table-hover transition-colors">
                                <td class="p-4 font-mono font-medium text-brand-navy">#1047</td>
                                <td class="p-4 font-medium">Hermione</td>
                                <td class="p-4">
                                    <span class="rounded-full bg-status-warning-bg text-status-warning-text border border-brand-amber/30 px-3 py-1 text-xs font-semibold">
                                        Horneado
                                    </span>
                                </td>
                                <td class="p-4 text-content-muted">25 de octubre</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Formulario -->
            <section class="rounded-xl border border-border-subtle bg-surface-card p-6 shadow-sm">
                <h2 class="text-xl font-bold text-content-heading">Registrar Pedido</h2>
                <form class="mt-4 grid gap-4 sm:grid-cols-2">
                    <div>
                        <label for="cliente" class="block text-sm font-medium text-content-body">Cliente</label>
                        <input id="cliente" type="text" placeholder="Nombre o empresa" class="mt-1 w-full rounded-lg border border-border-subtle bg-surface-app p-2.5 text-sm focus:border-brand-cyan focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-cyan/20 transition-all">
                    </div>
                    <div>
                        <label for="piezas" class="block text-sm font-medium text-content-body">Piezas</label>
                        <input id="piezas" type="number" placeholder="0" class="mt-1 w-full rounded-lg border border-border-subtle bg-surface-app p-2.5 text-sm focus:border-brand-cyan focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-cyan/20 transition-all">
                    </div>
                    <div class="sm:col-span-2 text-right">
                        <button type="submit" class="w-full sm:w-auto rounded-lg bg-brand-terracotta hover:bg-brand-hover-terracotta px-6 py-2.5 text-sm font-medium text-white transition-all shadow-sm active:scale-95">
                            Guardar Pedido
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- SCRIPT DE INTERACCIÓN -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleSidebar');
            const navButtons = document.querySelectorAll('.sidebar-nav-btn');

            // 1. Colapsar / Expandir menú lateral
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('is-collapsed');
            });

            // 2. Control de botón activo
            navButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    navButtons.forEach((item) => {
                        item.classList.remove('active', 'bg-brand-terracotta', 'text-white', 'shadow-md', 'shadow-brand-terracotta/20');
                        item.classList.add('text-content-muted', 'hover:bg-white/10', 'hover:text-white');
                        item.removeAttribute('aria-current');
                    });

                    btn.classList.remove('text-content-muted', 'hover:bg-white/10', 'hover:text-white');
                    btn.classList.add('active', 'bg-brand-terracotta', 'text-white', 'shadow-md', 'shadow-brand-terracotta/20');
                    btn.setAttribute('aria-current', 'page');
                });
            });
        });
    </script>
</body>
</html>
