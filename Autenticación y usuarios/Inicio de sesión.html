<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black antialiased">
    <header class="border-b border-gray-200 bg-white shadow-sm">
        <nav class="mx-auto flex max-w-5xl items-center justify-between p-4">
            <span class="text-xl font-bold tracking-tight">AH</span>
            <ul class="hidden gap-6 text-sm font-medium sm:flex">
                <li><a href="pedidos.html" class="border-b-2 border-orange-600 pb-1 text-orange-600">Pedidos</a></li>
                <li><a href="clientes.html" class="text-gray-500 hover:text-orange-600">Clientes</a></li>
                <li><a href="almacen.html" class="text-gray-500 hover:text-orange-600">Almacén</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto max-w-5xl space-y-8 p-4 py-8">

<!-- Tarjeta centrada de inicio de sesión -->
<section class="mx-auto w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <div class="text-center">
        <h1 class="text-2xl font-bold">Iniciar Sesión</h1>
        <p class="mt-1 text-sm text-gray-500">Accede con tu cuenta y selecciona tu rol.</p>
    </div>

    <form id="form-login" class="mt-6 space-y-4">
        <!-- Selector de rol -->
        <div>
            <label for="rol" class="block text-sm font-medium">Rol</label>
            <select id="rol"
                class="mt-1 w-full rounded-lg border border-gray-200 bg-white p-2.5 text-sm focus:border-orange-500 focus:outline-none">
                <option>Vendedor</option>
                <option>Almacén</option>
                <option>Administrador</option>
                <option>Cliente</option>
            </select>
        </div>

        <!-- Correo -->
        <div>
            <label for="login-correo" class="block text-sm font-medium">Correo electrónico</label>
            <input id="login-correo" type="email" placeholder="correo@ejemplo.com"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Contraseña con botón para mostrarla -->
        <div>
            <label for="login-password" class="block text-sm font-medium">Contraseña</label>
            <div class="relative mt-1">
                <input id="login-password" type="password" placeholder="Tu contraseña"
                    class="w-full rounded-lg border border-gray-200 p-2.5 pr-20 text-sm focus:border-orange-500 focus:outline-none">
                <button type="button" id="btn-mostrar"
                    class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-orange-600 hover:text-orange-700">
                    Mostrar
                </button>
            </div>
        </div>

        <!-- Recordarme y enlace de recuperación -->
        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-gray-500">
                <input type="checkbox" class="h-4 w-4 accent-orange-600">
                Recordarme
            </label>
            <a href="#" class="font-medium text-orange-600 hover:text-orange-700">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Mensaje de resultado del login -->
        <p id="mensaje-login" class="hidden rounded-lg border border-gray-200 bg-gray-50 p-3 text-sm"></p>

        <!-- Botón de acceso -->
        <button type="submit"
            class="w-full rounded-lg bg-orange-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-orange-700">
            Entrar
        </button>
    </form>
</section>

<!-- Formulario de registro comercial -->
<section class="mx-auto w-full max-w-2xl rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <h2 class="text-xl font-bold">Registro Comercial</h2>
    <p class="mt-1 text-sm text-gray-500">Da de alta tu negocio con sus datos fiscales para solicitar una cuenta de mayoreo.</p>

    <form id="form-registro" class="mt-4 grid gap-4 sm:grid-cols-2">
        <!-- Razón social -->
        <div class="sm:col-span-2">
            <label for="razon" class="block text-sm font-medium">Razón social</label>
            <input id="razon" type="text" placeholder="Nombre legal del negocio"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- RFC -->
        <div>
            <label for="reg-rfc" class="block text-sm font-medium">RFC</label>
            <input id="reg-rfc" type="text" maxlength="13" placeholder="12 o 13 caracteres"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm uppercase focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Teléfono -->
        <div>
            <label for="reg-telefono" class="block text-sm font-medium">Teléfono</label>
            <input id="reg-telefono" type="tel" maxlength="10" placeholder="10 dígitos"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Correo -->
        <div class="sm:col-span-2">
            <label for="reg-correo" class="block text-sm font-medium">Correo electrónico</label>
            <input id="reg-correo" type="email" placeholder="correo@ejemplo.com"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Contraseña -->
        <div>
            <label for="reg-password" class="block text-sm font-medium">Contraseña</label>
            <input id="reg-password" type="password" placeholder="Mínimo 8 caracteres"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Confirmar contraseña -->
        <div>
            <label for="reg-confirmar" class="block text-sm font-medium">Confirmar contraseña</label>
            <input id="reg-confirmar" type="password" placeholder="Repite la contraseña"
                class="mt-1 w-full rounded-lg border border-gray-200 p-2.5 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Aceptación de términos -->
        <div class="sm:col-span-2">
            <label class="flex items-center gap-2 text-sm text-gray-500">
                <input id="reg-terminos" type="checkbox" class="h-4 w-4 accent-orange-600">
                Acepto los términos y condiciones de venta mayorista
            </label>
        </div>

        <!-- Mensaje de resultado del registro -->
        <p id="mensaje-registro" class="hidden rounded-lg border border-gray-200 bg-gray-50 p-3 text-sm sm:col-span-2"></p>

        <!-- Botón de registro -->
        <div class="text-right sm:col-span-2">
            <button type="submit"
                class="w-full rounded-lg bg-orange-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-orange-700 sm:w-auto">
                Registrar Negocio
            </button>
        </div>
    </form>
</section>

<!-- Script del módulo de autenticación -->
<script>
    // Seleccionamos los elementos que vamos a usar
    const formLogin = document.getElementById('form-login');
    const formRegistro = document.getElementById('form-registro');
    const mensajeLogin = document.getElementById('mensaje-login');
    const mensajeRegistro = document.getElementById('mensaje-registro');
    const inputPasswordLogin = document.getElementById('login-password');
    const botonMostrar = document.getElementById('btn-mostrar');

    // Expresión sencilla para validar un correo (algo@dominio.com)
    const formatoCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Muestra un mensaje en una caja (texto plano, sin HTML)
    function mostrarMensaje(caja, texto) {
        caja.textContent = texto;
        caja.classList.remove('hidden');
    }

    // Botón "Mostrar / Ocultar" de la contraseña del login
    botonMostrar.addEventListener('click', function () {
        const estaOculta = inputPasswordLogin.type === 'password';

        inputPasswordLogin.type = estaOculta ? 'text' : 'password';
        botonMostrar.textContent = estaOculta ? 'Ocultar' : 'Mostrar';
    });

    // Login: valida los campos y saluda según el rol
    formLogin.addEventListener('submit', function (evento) {
        // Evitamos que la página se recargue
        evento.preventDefault();

        const rol = document.getElementById('rol').value;
        const correo = document.getElementById('login-correo').value.trim();
        const password = inputPasswordLogin.value;

        if (!formatoCorreo.test(correo)) {
            mostrarMensaje(mensajeLogin, 'Escribe un correo electrónico válido.');
            return;
        }

        if (password === '') {
            mostrarMensaje(mensajeLogin, 'Escribe tu contraseña.');
            return;
        }

        // Aquí iría la petición al servidor. Por ahora solo simulamos el acceso.
        mostrarMensaje(mensajeLogin, 'Sesión iniciada como ' + rol + ' (' + correo + ').');
        formLogin.reset();
    });

    // Registro comercial: valida todos los datos antes de aceptar
    formRegistro.addEventListener('submit', function (evento) {
        // Evitamos que la página se recargue
        evento.preventDefault();

        const razon = document.getElementById('razon').value.trim();
        const rfc = document.getElementById('reg-rfc').value.trim().toUpperCase();
        const telefono = document.getElementById('reg-telefono').value.trim();
        const correo = document.getElementById('reg-correo').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmar = document.getElementById('reg-confirmar').value;
        const terminos = document.getElementById('reg-terminos').checked;

        // Formato básico de RFC: 3 o 4 letras, 6 dígitos de fecha y 3 de homoclave
        const formatoRfc = /^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/;

        if (razon === '') {
            mostrarMensaje(mensajeRegistro, 'Escribe la razón social del negocio.');
        } else if (!formatoRfc.test(rfc)) {
            mostrarMensaje(mensajeRegistro, 'El RFC no tiene un formato válido (ej. MLE850312AB4).');
        } else if (!/^\d{10}$/.test(telefono)) {
            mostrarMensaje(mensajeRegistro, 'El teléfono debe tener 10 dígitos.');
        } else if (!formatoCorreo.test(correo)) {
            mostrarMensaje(mensajeRegistro, 'Escribe un correo electrónico válido.');
        } else if (password.length < 8 || !/\d/.test(password)) {
            mostrarMensaje(mensajeRegistro, 'La contraseña debe tener al menos 8 caracteres e incluir un número.');
        } else if (password !== confirmar) {
            mostrarMensaje(mensajeRegistro, 'Las contraseñas no coinciden.');
        } else if (!terminos) {
            mostrarMensaje(mensajeRegistro, 'Debes aceptar los términos y condiciones.');
        } else {
            mostrarMensaje(mensajeRegistro, 'Solicitud enviada para ' + razon + '. Revisaremos tus datos y te contactaremos.');
            formRegistro.reset();
        }
    });
</script>
