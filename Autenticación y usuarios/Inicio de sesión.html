<!-- Tarjeta centrada de inicio de sesión -->
<section class="mx-auto w-full max-w-md rounded-xl border border-stone-200 bg-white p-6">
    <div class="text-center">
        <h1 class="text-2xl font-bold text-stone-800">Iniciar Sesión</h1>
        <p class="mt-1 text-sm text-stone-500">Accede con tu cuenta y selecciona tu rol.</p>
    </div>

    <form class="mt-6 space-y-4">
        <!-- Selector de rol -->
        <div>
            <label for="rol" class="block text-sm font-medium text-stone-800">Rol</label>
            <select id="rol"
                class="mt-1 w-full rounded-lg border border-stone-300 bg-white p-2 text-sm focus:border-orange-500 focus:outline-none">
                <option>Vendedor</option>
                <option>Almacén</option>
                <option>Administrador</option>
                <option>Cliente</option>
            </select>
        </div>

<!-- Correo -->
        <div>
            <label for="login-correo" class="block text-sm font-medium text-stone-800">Correo electrónico</label>
            <input id="login-correo" type="email" placeholder="correo@ejemplo.com"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Contraseña -->
        <div>
            <label for="login-password" class="block text-sm font-medium text-stone-800">Contraseña</label>
            <input id="login-password" type="password" placeholder="Tu contraseña"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm focus:border-orange-500 focus:outline-none">
        </div>

<!-- Recordarme y enlace de recuperación -->
        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-stone-500">
                <input type="checkbox" class="h-4 w-4 accent-orange-600">
                Recordarme
            </label>
            <a href="#" class="font-medium text-orange-600 hover:text-orange-700">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón de acceso -->
        <button type="submit"
            class="w-full rounded-lg bg-orange-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-orange-700">
            Entrar
        </button>
    </form>
</section>

<!-- Formulario de registro comercial -->
<section class="mx-auto w-full max-w-2xl rounded-xl border border-stone-200 bg-white p-6">
    <h2 class="text-xl font-bold text-stone-800">Registro Comercial</h2>
    <p class="mt-1 text-sm text-stone-500">Da de alta tu negocio con sus datos fiscales para solicitar una cuenta de mayoreo.</p>

    <form class="mt-4 grid gap-4 sm:grid-cols-2">
        <!-- Razón social -->
        <div class="sm:col-span-2">
            <label for="razon" class="block text-sm font-medium text-stone-800">Razón social</label>
            <input id="razon" type="text" placeholder="Nombre legal del negocio"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- RFC -->
        <div>
            <label for="reg-rfc" class="block text-sm font-medium text-stone-800">RFC</label>
            <input id="reg-rfc" type="text" maxlength="13" placeholder="12 o 13 caracteres"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm uppercase focus:border-orange-500 focus:outline-none">
        </div>

<!-- Teléfono -->
        <div>
            <label for="reg-telefono" class="block text-sm font-medium text-stone-800">Teléfono</label>
            <input id="reg-telefono" type="tel" placeholder="10 dígitos"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Correo -->
        <div class="sm:col-span-2">
            <label for="reg-correo" class="block text-sm font-medium text-stone-800">Correo electrónico</label>
            <input id="reg-correo" type="email" placeholder="correo@ejemplo.com"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Contraseña -->
        <div>
            <label for="reg-password" class="block text-sm font-medium text-stone-800">Contraseña</label>
            <input id="reg-password" type="password" placeholder="Mínimo 8 caracteres"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm focus:border-orange-500 focus:outline-none">
        </div>

<!-- Confirmar contraseña -->
        <div>
            <label for="reg-confirmar" class="block text-sm font-medium text-stone-800">Confirmar contraseña</label>
            <input id="reg-confirmar" type="password" placeholder="Repite la contraseña"
                class="mt-1 w-full rounded-lg border border-stone-300 p-2 text-sm focus:border-orange-500 focus:outline-none">
        </div>

        <!-- Aceptación de términos -->
        <div class="sm:col-span-2">
            <label class="flex items-center gap-2 text-sm text-stone-500">
                <input type="checkbox" class="h-4 w-4 accent-orange-600">
                Acepto los términos y condiciones de venta mayorista
            </label>
        </div>
