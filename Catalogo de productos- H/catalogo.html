<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tu archivo de colores centralizado -->
    <script src="../Paletadecolores.js"></script>

    <style>
        /* Transición del sidebar y contenido */
        #sidebar,
        #main-wrapper {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar colapsado */
        #sidebar.is-collapsed {
            width: 5rem;
        }

        #sidebar.is-collapsed .sidebar-label,
        #sidebar.is-collapsed .brand-name {
            display: none;
        }

        #sidebar.is-collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        @media (min-width: 1024px) {
            #main-wrapper {
                margin-left: 16rem;
            }

            #sidebar.is-collapsed ~ #main-wrapper {
                margin-left: 5rem;
            }
        }

        /* Efecto del catálogo */
        .catalogo-card img {
            transition: transform 0.35s ease;
        }

        .catalogo-card:hover img {
            transform: scale(1.08);
        }

        .catalogo-overlay {
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .catalogo-card:hover .catalogo-overlay {
            opacity: 1;
        }

        /* Animación suave para el panel de detalles */
        #productDrawer {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-surface-app text-content-body antialiased min-h-screen flex flex-col lg:flex-row">

    <!-- SIDEBAR -->
    <aside
        id="sidebar"
        class="fixed top-0 left-0 z-40 h-screen w-64 bg-brand-navy text-white flex flex-col justify-between shadow-xl"
        aria-label="Navegación principal"
    >
        <div>
            <!-- Header del Sidebar -->
            <div class="flex items-center justify-between p-5 border-b border-white/10 h-20">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="h-10 w-10 shrink-0 rounded-xl bg-brand-terracotta flex items-center justify-center font-bold text-lg shadow-md">
                        C
                    </div>
                    <span class="brand-name font-bold text-lg tracking-wide whitespace-nowrap">
                        Cliente
                    </span>
                </div>

                <button
                    type="button"
                    id="toggleSidebar"
                    class="p-2 rounded-lg text-content-muted hover:text-white hover:bg-white/10 transition-colors"
                    aria-label="Colapsar menú"
                >
                    <svg
                        class="w-5 h-5 toggle-icon transition-transform duration-300"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
            </div>

            <!-- Navegación -->
            <nav class="p-4 space-y-1.5">
                <button
                    type="button"
                    class="sidebar-nav-btn active w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 bg-brand-terracotta text-white shadow-md shadow-brand-terracotta/20"
                    aria-label="Catálogo"
                    aria-current="page"
                    data-section="catalogo"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 11V7a4 4 0 0 0-8 0v4" />
                            <path d="M5 9h14l1 12H4L5 9Z" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Catálogo</span>
                </button>

                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Pedidos"
                    data-section="pedidos"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
                            <rect x="9" y="3" width="6" height="4" rx="2" />
                            <path d="M9 14h6M9 18h6" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Pedidos</span>
                </button>
            </nav>
        </div>

        <!-- Usuario -->
        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="h-9 w-9 shrink-0 rounded-full bg-brand-cream/20 text-brand-amber flex items-center justify-center font-bold text-xs uppercase border border-white/10">
                    AD
                </div>
                <div class="sidebar-label leading-tight overflow-hidden text-ellipsis whitespace-nowrap">
                    <p class="text-xs font-semibold text-white">Nombre cliente</p>
                    <p class="text-[11px] text-content-muted">Nombre tienda</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-wrapper" class="flex-1 w-full min-h-screen">
        <main class="mx-auto max-w-6xl space-y-8 p-6 lg:p-10">

            <header class="space-y-2">
                <h1 class="text-3xl font-bold text-content-heading">
                    Catálogo de Productos
                </h1>
                <p class="text-sm text-content-muted">
                    Haz clic sobre cualquier producto para ver sus detalles, componentes y precio sugerido.
                </p>
            </header>

            <!-- CATÁLOGO -->
            <section>
                <div
                    id="catalogo"
                    class="grid gap-5 grid-cols-2 sm:grid-cols-3 xl:grid-cols-4"
                ></div>
            </section>

        </main>
    </div>

    <!-- FONDO OSCURO (BACKDROP) -->
    <div
        id="drawerBackdrop"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"
    ></div>

    <!-- TARJETA LATERAL (DRAWER CARD) -->
    <aside
        id="productDrawer"
        class="fixed top-0 right-0 z-50 h-full w-full max-w-md bg-white shadow-2xl translate-x-full flex flex-col border-l border-gray-200"
        aria-hidden="true"
    >
        <!-- Encabezado de la tarjeta -->
        <div class="flex items-center justify-between p-5 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-800">Detalles del Producto</h2>
            <button
                type="button"
                id="closeDrawer"
                class="p-2 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors"
                aria-label="Cerrar detalles"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Contenido desplazable -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="aspect-square w-full rounded-2xl overflow-hidden bg-gray-50 border border-gray-100 shadow-inner flex items-center justify-center">
                <img id="drawerImage" src="" alt="" class="h-full w-full object-contain p-4">
            </div>

            <div class="space-y-1">
                <h3 id="drawerTitle" class="text-2xl font-bold text-gray-900 leading-snug"></h3>
                <p id="drawerPresentation" class="text-sm text-gray-500 font-medium"></p>
            </div>

            <!-- Precio sugerido -->
            <div class="bg-amber-50/80 border border-amber-200/60 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <span class="block text-xs uppercase tracking-wider font-semibold text-amber-800">Precio Sugerido</span>
                    <span id="drawerPrice" class="text-2xl font-black text-amber-900"></span>
                </div>
                <span class="text-xs px-2.5 py-1 bg-amber-200/60 text-amber-900 rounded-full font-semibold">Al público</span>
            </div>

            <!-- Componentes / Ingredientes -->
            <div class="space-y-2">
                <h4 class="text-xs uppercase font-bold tracking-wider text-gray-400">Componentes e Ingredientes</h4>
                <div id="drawerComponents" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <!-- Pie de tarjeta -->
        <div class="p-5 border-t border-gray-100 bg-gray-50/70">
            <button
                type="button"
                onclick="cerrarDetalles()"
                class="w-full py-2.5 px-4 rounded-xl font-medium text-sm text-gray-700 bg-white border border-gray-300 hover:bg-gray-100 transition-all shadow-sm"
            >
                Cerrar vista
            </button>
        </div>
    </aside>

    <!-- SCRIPTS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleSidebar');
            const navButtons = document.querySelectorAll('.sidebar-nav-btn');

            // Sidebar
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('is-collapsed');
            });

            navButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    navButtons.forEach((item) => {
                        item.classList.remove('active', 'bg-brand-terracotta', 'text-white', 'shadow-md', 'shadow-brand-terracotta/20');
                        item.classList.add('text-content-muted', 'hover:bg-white/10', 'hover:text-white');
                        item.removeAttribute('aria-current');
                    });
                    btn.classList.remove('text-content-muted', 'hover:bg-white/10', 'hover:text-white');
                    btn.classList.add('active', 'bg-brand-terracotta', 'text-white', 'shadow-md', 'shadow-brand-terracotta/20');
                    btn.setAttribute('aria-current', 'page');
                });
            });

            // Catálogo con datos extendidos (componentes y precio sugerido)
            const productos = [
                {
                    nombre: "Canels Celofan",
                    imagen: "../Imagenes/Catalogo/2.png",
                    precioSugerido: "$15.00",
                    presentacion: "Paquete con 4 pastillas surtidas",
                    componentes: ["Azúcar", "Goma base", "Jarabe de glucosa", "Saborizantes naturales y artificiales", "Colorantes"]
                },
                {
                    nombre: "Paleta ChupaChups",
                    imagen: "../Imagenes/Catalogo/3.png",
                    precioSugerido: "$8.50",
                    presentacion: "Pieza individual 12g",
                    componentes: ["Azúcar", "Jarabe de maíz", "Pulpa de fruta", "Ácido cítrico", "Lactato de sodio"]
                },
                {
                    nombre: "Gomitas Frutas",
                    imagen: "../Imagenes/Catalogo/4.png",
                    precioSugerido: "$18.00",
                    presentacion: "Bolsa 80g",
                    componentes: ["Grenetina", "Jarabe de glucosa", "Azúcar", "Ácido málico", "Cera de carnauba"]
                },
                {
                    nombre: "Chocolate Carlos V",
                    imagen: "../Imagenes/Catalogo/5.png",
                    precioSugerido: "$12.00",
                    presentacion: "Barra 18g",
                    componentes: ["Manteca de cacao", "Leche entera en polvo", "Pasta de cacao", "Lecitina de soya"]
                },
                {
                    nombre: "Caramelo JollyRancher",
                    imagen: "../Imagenes/Catalogo/6.png",
                    precioSugerido: "$5.00",
                    presentacion: "Caramelo macizo individual",
                    componentes: ["Jarabe de maíz", "Azúcar", "Ácido málico", "Aceite mineral", "Saborizante artificial"]
                },
                {
                    nombre: "Paleta PintaColores",
                    imagen: "../Imagenes/Catalogo/7.png",
                    precioSugerido: "$7.00",
                    presentacion: "Pieza con polvo acidulado",
                    componentes: ["Azúcar", "Dextrosa", "Ácido cítrico", "Colorante Azul 1", "Dióxido de titanio"]
                },
                {
                    nombre: "Paleta Pachicleta",
                    imagen: "../Imagenes/Catalogo/8.png",
                    precioSugerido: "$9.00",
                    presentacion: "Paleta con centro suave y chile",
                    componentes: ["Chile en polvo", "Sal yodada", "Azúcar", "Goma de mascar", "Harina de maíz"]
                },
                {
                    nombre: "Paleta Manita",
                    imagen: "../Imagenes/Catalogo/9.png",
                    precioSugerido: "$6.50",
                    presentacion: "Paleta sabor fresa y cereza",
                    componentes: ["Azúcar", "Glucosa", "Ácido cítrico", "Rojo Allura AC", "Saborizante"]
                },
                {
                    nombre: "Paleta Pinta Azul",
                    imagen: "../Imagenes/Catalogo/10.png",
                    precioSugerido: "$7.00",
                    presentacion: "Caramelo macizo pinta-lengua",
                    componentes: ["Azúcar", "Jarabe de maíz", "Colorante Azul brillante FCF", "Aromatizante"]
                },
                {
                    nombre: "Wafer Kalu",
                    imagen: "../Imagenes/Catalogo/11.png",
                    precioSugerido: "$14.00",
                    presentacion: "Galleta crujiente rellena",
                    componentes: ["Harina de trigo", "Grasa vegetal", "Cacao en polvo", "Suero de leche"]
                },
                {
                    nombre: "Gomitas Gummy Chirión",
                    imagen: "../Imagenes/Catalogo/12.png",
                    precioSugerido: "$16.50",
                    presentacion: "Gomitas enchiladas 65g",
                    componentes: ["Grenetina", "Mezcla de chiles secos", "Sal yodada", "Ácido cítrico"]
                },
                {
                    nombre: "Gomitas Icee Mango",
                    imagen: "../Imagenes/Catalogo/13.png",
                    precioSugerido: "$20.00",
                    presentacion: "Bolsa sellada 90g",
                    componentes: ["Azúcar", "Jarabe de alta fructosa", "Pectina", "Saborizante a Mango", "Tartrazina"]
                },
                {
                    nombre: "Caramelo Icee Cereza",
                    imagen: "../Imagenes/Catalogo/14.png",
                    precioSugerido: "$6.00",
                    presentacion: "Caramelo macizo sabor cereza",
                    componentes: ["Azúcar", "Jarabe de maíz", "Ácido láctico", "Saborizante artificial cereza"]
                },
                {
                    nombre: "Caramelo Icee Mora",
                    imagen: "../Imagenes/Catalogo/15.png",
                    precioSugerido: "$6.00",
                    presentacion: "Caramelo macizo mora azul",
                    componentes: ["Azúcar", "Glucosa", "Saborizante mora azul", "Colorante Azul 1"]
                },
                {
                    nombre: "Pastillas Halls",
                    imagen: "../Imagenes/Catalogo/16.png",
                    precioSugerido: "$13.00",
                    presentacion: "Tira con 9 pastillas",
                    componentes: ["Mentol", "Eucaliptol", "Azúcar", "Jarabe de glucosa", "Saborizantes"]
                },
                {
                    nombre: "Trufas Surtidas",
                    imagen: "../Imagenes/Catalogo/17.png",
                    precioSugerido: "$28.00",
                    presentacion: "Caja pequeña 3 pzas",
                    componentes: ["Pasta de cacao", "Crema de leche", "Avellana", "Mantequilla", "Vainilla"]
                },
                {
                    nombre: "Paleta Jumbo Cereza",
                    imagen: "../Imagenes/Catalogo/18.png",
                    precioSugerido: "$10.00",
                    presentacion: "Paleta extra grande con chicle",
                    componentes: ["Azúcar", "Base de goma", "Jarabe de maíz", "Ácido cítrico"]
                },
                {
                    nombre: "Chicle Orbit",
                    imagen: "../Imagenes/Catalogo/19.png",
                    precioSugerido: "$16.00",
                    presentacion: "Empaque con 14 láminas",
                    componentes: ["Sorbitol", "Goma base", "Xilitol", "Glicerol", "Aspartame", "Acesulfame K"]
                },
                {
                    nombre: "Paleta Pelon Peloneta",
                    imagen: "../Imagenes/Catalogo/20.png",
                    precioSugerido: "$11.00",
                    presentacion: "Paleta sabor tamarindo con mango",
                    componentes: ["Pulpa de tamarindo", "Chile en polvo", "Azúcar", "Sal yodada", "Ácido cítrico"]
                },
                {
                    nombre: "Chiclosos Café",
                    imagen: "../Imagenes/Catalogo/21.png",
                    precioSugerido: "$8.00",
                    presentacion: "Paquete de chiclosos sabor café",
                    componentes: ["Leche condensada", "Azúcar", "Mantequilla", "Extracto natural de café"]
                }
            ];

            // Renderizado del catálogo
            const catalogo = document.getElementById('catalogo');

            productos.forEach((producto) => {
                const card = document.createElement('article');

                card.className =
                    'catalogo-card relative overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm cursor-pointer hover:shadow-lg transition-all duration-200';

                card.innerHTML = `
                    <div class="aspect-square overflow-hidden bg-gray-50 flex items-center justify-center">
                        <img
                            src="${producto.imagen}"
                            alt="${producto.nombre}"
                            loading="lazy"
                            class="h-full w-full object-cover"
                        >
                    </div>

                    <div class="catalogo-overlay absolute inset-0 flex flex-col items-center justify-end bg-gradient-to-t from-black/85 via-black/40 to-transparent p-4 text-center">
                        <p class="text-base font-semibold text-white drop-shadow">
                            ${producto.nombre}
                        </p>
                        <span class="mt-1 text-xs text-amber-300 font-medium tracking-wide">
                            Clic para ver detalles →
                        </span>
                    </div>
                `;

                // Al hacer clic abre la tarjeta lateral
                card.addEventListener('click', () => {
                    abrirDetalles(producto);
                });

                catalogo.appendChild(card);
            });

            // Elementos del Drawer
            const drawer = document.getElementById('productDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const closeBtn = document.getElementById('closeDrawer');

            window.abrirDetalles = function(item) {
                document.getElementById('drawerTitle').textContent = item.nombre;
                document.getElementById('drawerPresentation').textContent = item.presentacion || 'Presentación estándar';
                document.getElementById('drawerPrice').textContent = item.precioSugerido || 'Consultar';

                const imgEl = document.getElementById('drawerImage');
                imgEl.src = item.imagen;
                imgEl.alt = item.nombre;

                // Contenedor de componentes/ingredientes
                const compContainer = document.getElementById('drawerComponents');
                compContainer.innerHTML = '';

                if (item.componentes && item.componentes.length > 0) {
                    item.componentes.forEach(comp => {
                        const tag = document.createElement('span');
                        tag.className = 'px-3 py-1 bg-gray-100 text-gray-700 text-xs font-medium rounded-lg border border-gray-200';
                        tag.textContent = comp;
                        compContainer.appendChild(tag);
                    });
                } else {
                    compContainer.innerHTML = '<span class="text-xs text-gray-400 italic">No se especificaron componentes.</span>';
                }

                // Mostrar el panel lateral
                drawer.classList.remove('translate-x-full');
                drawer.setAttribute('aria-hidden', 'false');

                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                backdrop.classList.add('opacity-100', 'pointer-events-auto');
            };

            window.cerrarDetalles = function() {
                drawer.classList.add('translate-x-full');
                drawer.setAttribute('aria-hidden', 'true');

                backdrop.classList.remove('opacity-100', 'pointer-events-auto');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
            };

            closeBtn.addEventListener('click', cerrarDetalles);
            backdrop.addEventListener('click', cerrarDetalles);

            // Cerrar con la tecla Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') cerrarDetalles();
            });
        });
    </script>
</body>
</html>
