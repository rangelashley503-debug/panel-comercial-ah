<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos</title>
    <!-- 1. Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Tu archivo de configuración de colores centralizado -->
    <script src="../Paletadecolores.js"></script>
</head>
<body class="bg-surface-app text-content-body antialiased">
    <!-- Barra de navegación fluida -->
    <header class="pt-8 pb-4 flex justify-center">
        <nav class="relative bg-surface-card w-[420px] h-[70px rounded-2xl] flex justify-center items-center shadow-sm border border-border-subtle px-2">
            <!-- indicador flotate , borde con color de fondo principal -->
            <div id=""indicador" class="absolute -top-6 w-16 h-16 bg-brand-terracota rounded-full border-[6px] border-surface-app transition-all duration-500 flex items-center shadow-md">
            </div>
            <!-- lista de botones -->
            <ul class="flex w-full justify-around z-10">
                <!-- boton 1 -->
                <li class="nav-item active flex-1 text-center group cursor-pointer" onclick="moveIndicator(this, 0)">
                    <a class="flex flex-col items-center justify-center relative">
                        <span class="icon text-white group-[.active]:-translate-y-8 transition-transform duration-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24 xmlns" xmlns="http://www.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                            </svg>
                        </span>
                        <span class="text text-xs text-content-body absolute bottom-[-18px] opacity-0 group-[.active]:opacity-100 group-[.active]:translate-y-[-10px] transition-all font-medium">
                            Inicio
                        </span>
                    </a>
                </li>
                <!-- boton 2 -->
                <li class="nav-item flex-1 text-center group cursor-pointer" onclick="moveIndicator(this, 1)">
                    <a class="flex flex-col items-center justify-center relative">
                        <span class="icon text-content-muted group-[.active]:-translate-y-8 group-[.active]:text-white transition-transform duration-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                            </svg>
                        </span>
                        <span class="text text-xs text-content-body absolute bottom-[-18px] opacity-0 group-[.active]:opacity-100 group-[.active]:translate-y-[-10px] transition-all duration-500 font-medium">
                            Pedidos
                        </span>
                    </a>
                </li>
                <!-- boton 3 -->
                <li class="nav-item flex-1 text-center group cursor-pointer" onclick="moveIndicator(this, 2)">
                    <a class="flex flex-col items-center justify-center relative">
                        <span class="icon text-content-muted group-[.active]:-translate-y-8 group-[.active]:text-white transition-transform duration-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                        </span>
                        <span class="text text-xs text-content-body absolute bottom-[-18px] opacity-0 group-[.active]:opacity-100 group-[.active]:translate-y-[-10px] transition-all duration-500 font-medium">
                            Nuevo
                        </span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto max-w-5xl space-y-8 p-4 py-8">
        <h1 class="text-3xl font-bold text-content-heading">Pedidos de la Semana</h1>

        <!-- Indicadores: 1 columna para móvil, 3 para pantalla grande -->
        <section class="grid gap-4 sm:grid-cols-3">
            <article class="rounded-xl border border-border-subtle bg-surface-card p-5 shadow-sm">
                <p class="text-sm font-medium text-content-muted">En Producción</p>
                <p class="mt-1 text-3xl font-bold text-brand-amber">18</p>
            </article>
            <article class="rounded-xl border border-border-subtle bg-surface-card p-5 shadow-sm">
                <p class="text-sm font-medium text-content-muted">Por Entregar</p>
                <p class="mt-1 text-3xl font-bold text-brand-cyan">5</p>
            </article>
            <article class="rounded-xl border border-border-subtle bg-surface-card p-5 shadow-sm">
                <p class="text-sm font-medium text-content-muted">Entregados</p>
                <p class="mt-1 text-3xl font-bold text-status-success-text">45</p>
            </article>
        </section>

        <!-- Tabla -->
        <section class="overflow-hidden rounded-xl border border-border-subtle bg-surface-card shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-brand-navy text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4 font-semibold">Folio</th>
                            <th class="p-4 font-semibold">Cliente</th>
                            <th class="p-4 font-semibold">Etapa</th>
                            <th class="p-4 font-semibold">Entrega</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-border-subtle">
                        <tr class="hover:bg-table-hover transition-colors">
                            <td class="p-4 font-mono font-medium text-brand-navy">#1045</td>
                            <td class="p-4 font-medium">Casa Talavera</td>
                            <td class="p-4">
                                <span class="rounded-full bg-status-info-bg text-status-info-text border border-brand-cyan/20 px-3 py-1 text-xs font-semibold">
                                    Esmaltado
                                </span>
                            </td>
                            <td class="p-4 text-content-muted">14 octubre</td>
                        </tr>
                        <tr class="bg-table-zebra hover:bg-table-hover transition-colors">
                            <td class="p-4 font-mono font-medium text-brand-navy">#1046</td>
                            <td class="p-4 font-medium">Hotel Posada</td>
                            <td class="p-4">
                                <span class="rounded-full bg-brand-cream/40 text-brand-navy border border-brand-cream px-3 py-1 text-xs font-semibold">
                                    Empaque
                                </span>
                            </td>
                            <td class="p-4 text-content-muted">20 de noviembre</td>
                        </tr>
                        <tr class="hover:bg-table-hover transition-colors">
                            <td class="p-4 font-mono font-medium text-brand-navy">#1047</td>
                            <td class="p-4 font-medium">Hermione</td>
                            <td class="p-4">
                                <span class="rounded-full bg-status-warning-bg text-status-warning-text border border-brand-amber/30 px-3 py-1 text-xs font-semibold">
                                    Horneado
                                </span>
                            </td>
                            <td class="p-4 text-content-muted">25 de octubre</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Formulario -->
        <section class="rounded-xl border border-border-subtle bg-surface-card p-6 shadow-sm">
            <h2 class="text-xl font-bold text-content-heading">Registrar Pedido</h2>
            <form class="mt-4 grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="cliente" class="block text-sm font-medium text-content-body">Cliente</label>
                    <input id="cliente" type="text" placeholder="Nombre o empresa" class="mt-1 w-full rounded-lg border border-border-subtle bg-surface-app p-2.5 text-sm focus:border-brand-cyan focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-cyan/20 transition-all">
                </div>
                <div>
                    <label for="piezas" class="block text-sm font-medium text-content-body">Piezas</label>
                    <input id="piezas" type="number" placeholder="0" class="mt-1 w-full rounded-lg border border-border-subtle bg-surface-app p-2.5 text-sm focus:border-brand-cyan focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-cyan/20 transition-all">
                </div>
                <div class="sm:col-span-2 text-right">
                    <button type="submit" class="w-full sm:w-auto rounded-lg bg-brand-terracotta hover:bg-brand-hover-terracotta px-6 py-2.5 text-sm font-medium text-white transition-all shadow-sm active:scale-95">
                        Guardar Pedido
                    </button>
                </div>
            </form>
        </section>
    </main>
    <script>
    const items = document.querySelectorAll('.nav-item');
    const indicator = document.getElementById('indicator');

    function moveIndicator(element, index) {
        items.forEach((item) => {
        item.classList.remove('active');
        const icon = item.querySelector('.icon');
        icon.classList.remove('text-white');
        icon.classList.add('text-content-muted');
        });

        element.classList.add('active');
        const activeIcon = element.querySelector('.icon');
        activeIcon.classList.remove('text-content-muted');
        activeIcon.classList.add('text-white');

      // Cálculo del desplazamiento horizontal según el ancho (420px - padding)
        const totalWidth = 420 - 16;
        const step = totalWidth / items.length;
      const offset = (step * index) + (step / 2) - (totalWidth / 2);

        indicator.style.transform = `translateX(${offset}px)`;
    }

    // Inicializar posición en el primer botón al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        const activeItem = document.querySelector('.nav-item.active');
        if (activeItem) {
        moveIndicator(activeItem, 0);
        }
    });
</script>
</body>
</body>
</html>
