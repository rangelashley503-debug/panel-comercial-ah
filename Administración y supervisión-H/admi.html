<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tu archivo de colores centralizado -->
    <script src="../Paletadecolores.js"></script>

    <style>
        /* Transición del sidebar y contenido */
        #sidebar,
        #main-wrapper {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar colapsado */
        #sidebar.is-collapsed {
            width: 5rem;
        }

        #sidebar.is-collapsed .sidebar-label,
        #sidebar.is-collapsed .brand-name {
            display: none;
        }

        #sidebar.is-collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        @media (min-width: 1024px) {
            #main-wrapper {
                margin-left: 16rem;
            }

            #sidebar.is-collapsed ~ #main-wrapper {
                margin-left: 5rem;
            }
        }

        /* Efecto del catálogo */
        .catalogo-card img {
            transition: transform 0.35s ease;
        }

        .catalogo-card:hover img {
            transform: scale(1.08);
        }

        .catalogo-overlay {
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .catalogo-card:hover .catalogo-overlay {
            opacity: 1;
        }

        /* Animación fluida de la tarjeta lateral */
        #productDrawer {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* Personalización de la barra de desplazamiento */
        nav::-webkit-scrollbar,
        #productDrawer .overflow-y-auto::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 8px;
        }

        /* Fondo del recuadro / carril del scroll (Azul) */
        nav::-webkit-scrollbar-track,
        #productDrawer .overflow-y-auto::-webkit-scrollbar-track,
        body::-webkit-scrollbar-track {
            background-color: #1A3A68; /* Azul base */
            border-radius: 9999px;
        }

        /* Barra deslizante (Thumb) */
        nav::-webkit-scrollbar-thumb,
        #productDrawer .overflow-y-auto::-webkit-scrollbar-thumb,
        body::-webkit-scrollbar-thumb {
            background-color: #07A6D8; /* Tono azul cyan de contraste */
            border-radius: 9999px;
            border: 2px solid #1A3A68; /* Espacio para que luzca estilizado */
        }

        /* Color al pasar el cursor sobre la barra */
        nav::-webkit-scrollbar-thumb:hover,
        #productDrawer .overflow-y-auto::-webkit-scrollbar-thumb:hover,
        body::-webkit-scrollbar-thumb:hover {
            background-color: #F09D25; /* Tono ámbar activo */
        }

        /* Compatibilidad para navegadores modernos (Firefox) */
        nav,
        #productDrawer .overflow-y-auto,
        body {
            scrollbar-width: thin;
            scrollbar-color: #07A6D8 #1A3A68; /* color deslizador - color fondo */
        }
    </style>
</head>

<body class="bg-surface-app text-content-body antialiased min-h-screen flex flex-col lg:flex-row">

    <!-- SIDEBAR -->
    <aside
        id="sidebar"
        class="fixed top-0 left-0 z-40 h-screen w-64 bg-brand-navy text-white flex flex-col justify-between shadow-xl"
        aria-label="Navegación principal"
    >
        <div>
            <!-- Header del Sidebar -->
            <div class="flex items-center justify-between p-5 border-b border-white/10 h-20">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="h-10 w-10 shrink-0 rounded-xl bg-brand-terracotta flex items-center justify-center font-bold text-lg shadow-md">
                        A
                    </div>
                    <span class="brand-name font-bold text-lg tracking-wide whitespace-nowrap">
                        Administrador
                    </span>
                </div>

                <button
                    type="button"
                    id="toggleSidebar"
                    class="p-2 rounded-lg text-content-muted hover:text-white hover:bg-white/10 transition-colors"
                    aria-label="Colapsar menú"
                >
                    <svg
                        class="w-5 h-5 toggle-icon transition-transform duration-300"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
            </div>

<!-- Navegación -->
            <nav class="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-10rem)]">
                <!-- Catálogo -->
                <button
                    type="button"
                    class="sidebar-nav-btn active w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 bg-brand-terracotta text-white shadow-md shadow-brand-terracotta/20"
                    aria-label="Catálogo"
                    aria-current="page"
                    data-section="catalogo"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 11V7a4 4 0 0 0-8 0v4" />
                            <path d="M5 9h14l1 12H4L5 9Z" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Catálogo</span>
                </button>

                <!-- Inventario -->
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Inventario"
                    data-section="inventario"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
                            <rect x="9" y="3" width="6" height="4" rx="2" />
                            <path d="M9 14h6M9 18h6" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Inventario</span>
                </button>

                <!-- Administración -->
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Administración"
                    data-section="administracion"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V17a1 1 0 0 1-2 0v-.07A7 7 0 0 1 5.07 11H5a1 1 0 0 1 0-2h.07A7 7 0 0 1 11 5.07V5a1 1 0 0 1 2 0v.07A7 7 0 0 1 18.93 11H19a1 1 0 0 1 0 2h-.07A7 7 0 0 1 13 16.93z" />
                            <circle cx="12" cy="12" r="2" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Administración</span>
                </button>

                <!-- Clientes -->
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Clientes"
                    data-section="clientes"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Clientes</span>
                </button>

                <!-- Pedidos -->
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Pedidos"
                    data-section="pedidos"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
                            <path d="m3.3 7 8.7 5 8.7-5" />
                            <path d="M12 22V12" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Pedidos</span>
                </button>

                <!-- Pagos -->
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Pagos"
                    data-section="pagos"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2" />
                            <line x1="2" y1="10" x2="22" y2="10" />
                            <circle cx="7" cy="15" r="1" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Pagos</span>
                </button>

                <!-- Surtido -->
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Surtido"
                    data-section="surtido"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="3" width="15" height="13" rx="1" />
                            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
                            <circle cx="5.5" cy="18.5" r="2.5" />
                            <circle cx="18.5" cy="18.5" r="2.5" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Surtido</span>
                </button>

                <!-- Mostrador -->
                <button
                    type="button"
                    class="sidebar-nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl font-medium text-sm transition-all duration-200 text-content-muted hover:bg-white/10 hover:text-white"
                    aria-label="Mostrador"
                    data-section="mostrador"
                >
                    <span class="shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3h18v4H3z" />
                            <path d="M4 7v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7" />
                            <path d="M10 11h4" />
                            <path d="M9 15h6" />
                        </svg>
                    </span>
                    <span class="sidebar-label whitespace-nowrap">Mostrador</span>
                </button>
            </nav>
        </div>

        <!-- Usuario -->
        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="h-9 w-9 shrink-0 rounded-full bg-brand-cream/20 text-brand-amber flex items-center justify-center font-bold text-xs uppercase border border-white/10">
                    RV
                </div>
                <div class="sidebar-label leading-tight overflow-hidden text-ellipsis whitespace-nowrap">
                    <p class="text-xs font-semibold text-white">Ray Vázquez</p>
                    <p class="text-[11px] text-content-muted">Administrador</p>
                </div>
            </div>
        </div>
    </aside>
